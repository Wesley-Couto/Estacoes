<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos e Treinamentos</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rotina Estação">
</head>

<body>

    <div class="app-container">
        <header>
            <span class="header-badge" style="color: #7c3aed; background: #f3e8ff;">Capacitação</span>
            <h1>Cursos e Treinamentos</h1>
            <p>Acesso rápido às plataformas da empresa</p>
        </header>

        <div class="access-list" id="access-list"></div>

        <nav class="bottom-nav">
            <a href="index.html" class="back-btn">← Voltar ao Painel Principal</a>
        </nav>
    </div>

    <script>
        const plataformasCursos = [
            {
                titulo: "Quiz Operacional",
                descricao: "Testes rápidos e reciclagem de procedimentos",
                url: "https://script.google.com/a/macros/metrobh.com.br/s/AKfycbzaS_b4hh9A1421iVJsr9qy0ur7krLMLmgjexrkRXWZIOcwu0ZyKPLjtSvx0L5JB3CB/exec"
            },
            {
                titulo: "Escola Mobifácil",
                descricao: "Portal oficial de cursos e treinamentos da empresa",
                url: "https://www.escolamobifacil.com.br/login"
            }
        ];

        function renderizarAcessos() {
            const container = document.getElementById('access-list');
            container.innerHTML = '';

            plataformasCursos.forEach(item => {
                const card = document.createElement('a');
                card.href = item.url;
                card.target = "_blank";
                card.className = "access-card";

                card.innerHTML = `
                    <div class="access-info">
                        <span class="access-title">${item.titulo}</span>
                        <span class="access-desc">${item.descricao}</span>
                    </div>
                    <span class="access-icon">Abrir ↗</span>
                `;

                container.appendChild(card);
            });
        }

        renderizarAcessos();
    </script>

</body>

</html>
