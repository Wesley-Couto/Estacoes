<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários Diários - Checklist</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rotina Estação">
</head>

<body>

    <div class="app-container">
        <header>
            <div class="header-top-row">
                <span class="header-badge" id="badge-estacao">Novo Eldorado • 1° Turno</span>
                <span class="sync-pill" id="sync-status">● Conectando...</span>
            </div>
            <h1>Formulários Diários</h1>
            <p id="current-date"></p>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </header>

        <div class="task-list" id="task-list"></div>

        <nav class="bottom-nav">
            <a href="index.html" class="back-btn">← Voltar ao Painel Principal</a>
        </nav>
    </div>

    <script src="sync.js"></script>
    <script>
        const formulariosExternos = [
            {
                id: "form_1",
                titulo: "1. CHECK-LIST DIÁRIO",
                url: "https://docs.google.com/forms/d/e/1FAIpQLSc4v6_KL56tjJqakxfiiy4c0zPyR8ElrLbuv0aFtrZYO-GXLA/viewform",
                contabilizar: true
            },
            {
                id: "form_2",
                titulo: "2. CHECK-LIST DEA",
                url: "https://docs.google.com/forms/d/1Uiq2Z85dtfQXVUfXPlFWl8kIqPLkMXTXzFLw_-5H6fU/viewform?edit_requested=true",
                contabilizar: true
            },
            {
                id: "form_4",
                titulo: "3. CHECK LIST ATM",
                url: "https://docs.google.com/forms/d/e/1FAIpQLSdYCd0Q0nhNq9eIgOBBBllZMWqLrbCgojTKJsIIeiToH_mxVQ/viewform",
                contabilizar: true
            },
            {
                id: "form_5",
                titulo: "4. CHECK LIST BILHETERIA",
                url: "https://docs.google.com/forms/d/e/1FAIpQLSczaFm92wFpjvR05Mt1rx2WoZFav8NR_H0EaTQT44QrOhqIxg/viewform",
                contabilizar: true
            },
            {
                id: "form_copasa",
                titulo: "5. LEITURA DE ARQUIVOS COPASA",
                url: "https://docs.google.com/forms/d/e/1FAIpQLSfKsgOPBiNZwsiREOLCmVUlEI5LEH1idKyxVlxCDD83rC9aNw/viewform",
                contabilizar: false
            }
        ];

        const hoje = obterDataHojeBR();
        document.getElementById('current-date').innerText = `Data: ${hoje}`;
        verificarViradaDeDia();

        const estacaoAtual = localStorage.getItem('checklist_estacao') || 'Novo Eldorado';
        const turnoAtual = localStorage.getItem('checklist_turno') || '1° Turno';

        document.getElementById('badge-estacao').innerText = `${estacaoAtual} • ${turnoAtual}`;

        let concluidos = lerChecklistLocal(estacaoAtual, turnoAtual);

        function atualizarIndicadorSync(estado) {
            const el = document.getElementById('sync-status');
            el.className = `sync-pill ${estado}`;
            if (estado === 'sincronizando') el.innerText = '↻ Sincronizando...';
            else if (estado === 'online') el.innerText = '● Online';
            else el.innerText = '○ Offline (Local)';
        }

        function renderizarLista() {
            const container = document.getElementById('task-list');
            container.innerHTML = '';

            formulariosExternos.forEach(item => {
                const isDone = concluidos.includes(item.id);
                const card = document.createElement('div');
                card.className = `task-card ${isDone ? 'completed' : ''}`;

                if (!item.contabilizar) {
                    card.style.borderLeftColor = '#64748b';
                }

                card.innerHTML = `
                    <div class="task-info">
                        <span class="task-title">${item.titulo}</span>
                        <a href="${item.url}" target="_blank" class="task-link" onclick="aoClicarNoLink('${item.id}')">Abrir formulário ↗</a>
                    </div>
                    ${item.contabilizar ? `
                    <button class="check-btn" onclick="alternarCheck('${item.id}')" title="Marcar como concluído">
                        ✓
                    </button>
                    ` : `
                    <span style="font-size: 0.72rem; font-weight: 700; color: #64748b; background: #f1f5f9; padding: 5px 10px; border-radius: 999px; flex-shrink: 0;">
                        Opcional
                    </span>
                    `}
                `;

                container.appendChild(card);
            });

            atualizarProgresso();
        }

        async function alternarCheck(id) {
            const estavaMarcado = concluidos.includes(id);
            if (estavaMarcado) {
                concluidos = concluidos.filter(item => item !== id);
            } else {
                concluidos.push(id);
            }
            renderizarLista();
            await enviarChecklistOnline(estacaoAtual, turnoAtual, concluidos, atualizarIndicadorSync, {
                acao: estavaMarcado ? 'desmarcar' : 'marcar',
                itemId: id
            });
        }

        async function aoClicarNoLink(id) {
            const item = formulariosExternos.find(f => f.id === id);
            if (!item || !item.contabilizar) return;

            if (!concluidos.includes(id)) {
                concluidos.push(id);
                renderizarLista();
                await enviarChecklistOnline(estacaoAtual, turnoAtual, concluidos, atualizarIndicadorSync, {
                    acao: 'marcar',
                    itemId: id
                });
            }
        }

        function atualizarProgresso() {
            const obrigatorios = formulariosExternos.filter(item => item.contabilizar);
            const feitosObrigatorios = obrigatorios.filter(item => concluidos.includes(item.id)).length;
            const porcentagem = (feitosObrigatorios / obrigatorios.length) * 100;
            document.getElementById('progress-bar').style.width = `${porcentagem}%`;
        }

        async function sincronizarLista() {
            const mapa = await buscarChecklistsOnline(atualizarIndicadorSync);
            if (mapa !== null) {
                const chave = `${estacaoAtual}_${turnoAtual}`;
                concluidos = mapa[chave] || [];
                salvarChecklistLocal(estacaoAtual, turnoAtual, concluidos);
                renderizarLista();
            }
        }

        renderizarLista();
        sincronizarLista();
        iniciarSincronizacaoAutomatica(sincronizarLista);
    </script>

</body>

</html>
