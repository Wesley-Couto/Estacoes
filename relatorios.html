<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passagem de Turno - Relatórios</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d97706">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rotina Estação">
</head>

<body>

    <div class="app-container">
        <header>
            <span class="header-badge" id="badge-estacao" style="color: #b45309; background: #fef3c7;">Novo Eldorado •
                1° Turno</span>
            <h1>Passagem de Turno</h1>
            <p id="current-date"></p>
        </header>

        <section class="report-form-card">
            <h2 class="section-title">Registrar Relatório do Turno</h2>

            <div class="form-group">
                <label for="input-agente">Agente / Matrícula <span class="required-mark">*</span></label>
                <input type="text" id="input-agente" placeholder="Ex: Silva - Mat. 12345" maxlength="80" required>
            </div>

            <div class="form-group">
                <label for="input-texto">Ocorrências e Observações para o Próximo Turno <span
                        class="required-mark">*</span></label>
                <textarea id="input-texto" rows="4"
                    placeholder="Descreva pendências, ocorrências operacionais, equipamentos ou recados importantes..."
                    required></textarea>
            </div>

            <div class="checkbox-inline">
                <input type="checkbox" id="incluir-checklist" checked>
                <label for="incluir-checklist">Anexar resumo automático do checklist atual</label>
            </div>

            <div class="form-actions">
                <button type="button" class="submit-report-btn" id="btn-enviar" onclick="enviarRelatorio()">
                    Salvar na Nuvem
                </button>
                <button type="button" class="copy-report-btn" id="btn-copiar-wpp" onclick="copiarParaWhatsApp()">
                    📋 Copiar p/ WhatsApp
                </button>
            </div>

            <div id="status-feedback" class="status-feedback"></div>
        </section>

        <section class="history-section">
            <div class="history-header">
                <h2 class="section-title">Histórico de Relatórios</h2>
                <button type="button" class="refresh-btn" onclick="carregarRelatorios()">↻ Atualizar</button>
            </div>

            <div class="filter-bar-enhanced">
                <div class="filter-row-top">
                    <select id="filtro-turno" onchange="aplicarFiltros()">
                        <option value="TODOS">Todos os Turnos</option>
                        <option value="1° Turno">1° Turno</option>
                        <option value="2° Turno">2° Turno</option>
                    </select>

                    <div class="date-input-wrapper">
                        <input type="text" id="filtro-data" placeholder="Data: DD/MM/AAAA" maxlength="10"
                            inputmode="numeric" oninput="mascaraDataEFiltrar(this)">
                        <button type="button" id="btn-limpar-data" class="clear-filter-btn" onclick="limparFiltroData()"
                            title="Limpar data" style="display: none;">✕</button>
                    </div>
                </div>

                <select id="filtro-estacao" onchange="aplicarFiltros()">
                    <option value="ATUAL">Apenas esta estação</option>
                    <option value="TODAS">Todas as estações</option>
                    <option value="Novo Eldorado">Novo Eldorado</option>
                    <option value="Eldorado">Eldorado</option>
                    <option value="Cidade Industrial">Cidade Industrial</option>
                    <option value="Vila Oeste">Vila Oeste</option>
                    <option value="Gameleira">Gameleira</option>
                    <option value="Nova Suíça">Nova Suíça</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Calafate">Calafate</option>
                    <option value="Carlos Prates">Carlos Prates</option>
                    <option value="Lagoinha">Lagoinha</option>
                    <option value="Central">Central</option>
                    <option value="Santa Efigênia">Santa Efigênia</option>
                    <option value="Santa Tereza">Santa Tereza</option>
                    <option value="Horto Florestal">Horto Florestal</option>
                    <option value="Santa Inês">Santa Inês</option>
                    <option value="José Candido Da Silveira">José Candido Da Silveira</option>
                    <option value="Minas Shopping">Minas Shopping</option>
                    <option value="São Gabriel">São Gabriel</option>
                    <option value="Primeiro de maio">Primeiro de maio</option>
                    <option value="Waldomiro Lobo">Waldomiro Lobo</option>
                    <option value="Floramar">Floramar</option>
                    <option value="Vilarinho">Vilarinho</option>
                </select>

                <div class="date-input-wrapper">
                    <input type="text" id="filtro-palavra"
                        placeholder="🔍 Buscar por palavra-chave, agente ou ocorrência..."
                        oninput="aoDigitarPalavra(this)">
                    <button type="button" id="btn-limpar-palavra" class="clear-filter-btn"
                        onclick="limparFiltroPalavra()" title="Limpar busca" style="display: none;">✕</button>
                </div>
            </div>

            <div id="lista-relatorios" class="report-list">
                <div class="loading-box">Carregando relatórios da nuvem...</div>
            </div>
        </section>

        <nav class="bottom-nav">
            <a href="index.html" class="back-btn">← Voltar ao Painel Principal</a>
        </nav>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywPITfSjedOrEEIPIgeyAxL33JZ-QWRTw_rdgZx4WGz7P7TM4Ksi3ZLyEokTpOs9qg/exec";

        const hoje = new Date().toLocaleDateString('pt-BR');
        document.getElementById('current-date').innerText = `Data: ${hoje}`;

        const estacaoAtual = localStorage.getItem('checklist_estacao') || 'Novo Eldorado';
        const turnoAtual = localStorage.getItem('checklist_turno') || '1° Turno';
        document.getElementById('badge-estacao').innerText = `${estacaoAtual} • ${turnoAtual}`;

        const inputAgente = document.getElementById('input-agente');
        const inputTexto = document.getElementById('input-texto');
        const agenteSalvo = localStorage.getItem('checklist_agente');
        if (agenteSalvo) {
            inputAgente.value = agenteSalvo;
        }

        inputAgente.addEventListener('input', () => {
            inputAgente.classList.remove('input-error');
            localStorage.setItem('checklist_agente', inputAgente.value);
        });
        inputTexto.addEventListener('input', () => {
            inputTexto.classList.remove('input-error');
        });

        let todosRelatorios = [];

        function normalizarDataBR(valor) {
            const texto = String(valor || '').trim();
            if (!texto) return '';

            // Já está no formato DD/MM/AAAA
            if (/^\d{2}\/\d{2}\/\d{4}/.test(texto)) {
                return texto;
            }

            // Converte caso venha como ISO (2026-11-22T...) ou Date string
            const dataObj = new Date(texto);
            if (!isNaN(dataObj.getTime())) {
                const dia = String(dataObj.getDate()).padStart(2, '0');
                const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
                const ano = dataObj.getFullYear();
                const hora = String(dataObj.getHours()).padStart(2, '0');
                const min = String(dataObj.getMinutes()).padStart(2, '0');
                return `${dia}/${mes}/${ano} ${hora}:${min}`;
            }

            return texto;
        }

        function normalizarTextoBusca(str) {
            return String(str || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        function gerarResumoChecklist() {
            const idsExternos = ["form_1", "form_2", "form_4", "form_5"];
            const idsInternos = ["check_1", "check_2", "check_3", "check_4", "check_5", "check_6"];
            const chaveConcluidos = `checklist_concluidos_${estacaoAtual}_${turnoAtual}`;
            const concluidos = JSON.parse(localStorage.getItem(chaveConcluidos)) || [];

            const feitosExt = idsExternos.filter(id => concluidos.includes(id)).length;
            const feitosInt = idsInternos.filter(id => concluidos.includes(id)).length;

            return `Formulários: ${feitosExt}/${idsExternos.length} | Rotinas: ${feitosInt}/${idsInternos.length}`;
        }

        function mostrarStatus(mensagem, tipo) {
            const box = document.getElementById('status-feedback');
            box.innerText = mensagem;
            box.className = `status-feedback visible ${tipo}`;
        }

        function validarCamposObrigatorios() {
            const agente = inputAgente.value.trim();
            const texto = inputTexto.value.trim();

            if (!agente) {
                inputAgente.classList.add('input-error');
                inputAgente.focus();
                mostrarStatus("Preencha o campo obrigatório: Agente / Matrícula.", "error");
                return false;
            }

            if (!texto) {
                inputTexto.classList.add('input-error');
                inputTexto.focus();
                mostrarStatus("Preencha o campo obrigatório: Ocorrências e Observações.", "error");
                return false;
            }

            localStorage.setItem('checklist_agente', agente);
            return true;
        }

        async function enviarRelatorio() {
            if (!validarCamposObrigatorios()) return;

            const agente = inputAgente.value.trim();
            const texto = inputTexto.value.trim();
            const incluirCheck = document.getElementById('incluir-checklist').checked;
            const btnEnviar = document.getElementById('btn-enviar');

            const payload = {
                estacao: estacaoAtual,
                turno: turnoAtual,
                agente: agente,
                texto: texto,
                checklistResumo: incluirCheck ? gerarResumoChecklist() : ""
            };

            btnEnviar.disabled = true;
            btnEnviar.innerText = "Enviando...";
            mostrarStatus("Salvando relatório na planilha...", "info");

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                inputTexto.value = "";
                mostrarStatus("Relatório registrado com sucesso!", "success");

                setTimeout(() => {
                    carregarRelatorios();
                }, 1200);
            } catch (erro) {
                mostrarStatus("Erro de conexão ao salvar. Verifique sua internet.", "error");
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Salvar na Nuvem";
            }
        }

        function copiarParaWhatsApp() {
            if (!validarCamposObrigatorios()) return;

            const agente = inputAgente.value.trim();
            const texto = inputTexto.value.trim();
            const incluirCheck = document.getElementById('incluir-checklist').checked;
            const btn = document.getElementById('btn-copiar-wpp');

            let mensagem = `*PASSAGEM DE TURNO - ${estacaoAtual.toUpperCase()}*\n`;
            mensagem += `📅 Data: ${hoje} | 🕒 ${turnoAtual}\n`;
            mensagem += `👤 Agente: ${agente}\n`;
            if (incluirCheck) {
                mensagem += `✅ ${gerarResumoChecklist()}\n`;
            }
            mensagem += `\n*Relatório / Ocorrências:*\n${texto}`;

            navigator.clipboard.writeText(mensagem).then(() => {
                const original = btn.innerText;
                btn.innerText = "✓ Copiado!";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = original;
                    btn.classList.remove('copied');
                }, 2500);
            });
        }

        async function carregarRelatorios() {
            const container = document.getElementById('lista-relatorios');
            container.innerHTML = '<div class="loading-box">Buscando relatórios atualizados...</div>';

            try {
                const resposta = await fetch(`${SCRIPT_URL}?t=${new Date().getTime()}`);
                if (!resposta.ok) throw new Error("Falha na resposta");

                const dadosBrutos = await resposta.json();
                todosRelatorios = (dadosBrutos || []).map(item => ({
                    ...item,
                    dataHoraFormatada: normalizarDataBR(item.dataHora)
                }));
                aplicarFiltros();
            } catch (erro) {
                container.innerHTML = '<div class="empty-box error">Não foi possível carregar o histórico. Verifique a conexão com a internet.</div>';
            }
        }

        function mascaraDataEFiltrar(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 8) valor = valor.slice(0, 8);

            if (valor.length >= 5) {
                valor = `${valor.slice(0, 2)}/${valor.slice(2, 4)}/${valor.slice(4)}`;
            } else if (valor.length >= 3) {
                valor = `${valor.slice(0, 2)}/${valor.slice(2)}`;
            }

            input.value = valor;
            document.getElementById('btn-limpar-data').style.display = valor ? 'flex' : 'none';
            aplicarFiltros();
        }

        function limparFiltroData() {
            const inputData = document.getElementById('filtro-data');
            inputData.value = '';
            document.getElementById('btn-limpar-data').style.display = 'none';
            aplicarFiltros();
        }

        function aoDigitarPalavra(input) {
            document.getElementById('btn-limpar-palavra').style.display = input.value.trim() ? 'flex' : 'none';
            aplicarFiltros();
        }

        function limparFiltroPalavra() {
            const inputPalavra = document.getElementById('filtro-palavra');
            inputPalavra.value = '';
            document.getElementById('btn-limpar-palavra').style.display = 'none';
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const filtroEstacao = document.getElementById('filtro-estacao').value;
            const filtroTurno = document.getElementById('filtro-turno').value;
            const filtroData = document.getElementById('filtro-data').value.trim();
            const filtroPalavra = normalizarTextoBusca(document.getElementById('filtro-palavra').value.trim());
            const container = document.getElementById('lista-relatorios');

            let filtrados = todosRelatorios;

            if (filtroEstacao === "ATUAL") {
                filtrados = filtrados.filter(item => item.estacao === estacaoAtual);
            } else if (filtroEstacao !== "TODAS") {
                filtrados = filtrados.filter(item => item.estacao === filtroEstacao);
            }

            if (filtroTurno !== "TODOS") {
                filtrados = filtrados.filter(item => item.turno === filtroTurno);
            }

            if (filtroData !== "") {
                filtrados = filtrados.filter(item => {
                    const apenasData = String(item.dataHoraFormatada || '').split(' ')[0];
                    return apenasData.startsWith(filtroData);
                });
            }

            if (filtroPalavra !== "") {
                filtrados = filtrados.filter(item => {
                    const textoCompleto = normalizarTextoBusca(
                        `${item.texto} ${item.agente} ${item.estacao} ${item.turno} ${item.checklistResumo}`
                    );
                    return textoCompleto.includes(filtroPalavra);
                });
            }

            if (!filtrados || filtrados.length === 0) {
                container.innerHTML = '<div class="empty-box">Nenhum relatório encontrado para os filtros selecionados.</div>';
                return;
            }

            container.innerHTML = '';
            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.className = 'report-item-card';

                const textoFormatado = escaparHTML(item.texto).replace(/\n/g, '<br>');
                const resumoCheck = item.checklistResumo
                    ? `<div class="report-checklist-tag">📋 ${escaparHTML(item.checklistResumo)}</div>`
                    : '';

                card.innerHTML = `
                    <div class="report-item-header">
                        <span class="report-station-tag">${escaparHTML(item.estacao)} • ${escaparHTML(item.turno)}</span>
                        <span class="report-date">${escaparHTML(item.dataHoraFormatada)}</span>
                    </div>
                    <div class="report-author">👤 ${escaparHTML(item.agente)}</div>
                    <div class="report-body">${textoFormatado}</div>
                    ${resumoCheck}
                `;
                container.appendChild(card);
            });
        }

        function escaparHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        carregarRelatorios();
    </script>

</body>

</html>
